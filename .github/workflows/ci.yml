# SPDX-License-Identifier: MIT
# Intégration continue du dépôt public : installation, typage, lint et construction sur Node 24 (service navigateur compris).
# La suite de tests vit dans le dépôt de développement des mainteneurs, qui la passent avant de fusionner.
# Les actions sont épinglées par SHA de commit (le tag est en commentaire) ; Dependabot les met à jour.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Une seule version du produit : chaque emplacement porte celle du package.json racine.
      - run: npm run bump -- --check
      # Service navigateur : ses propres modules (Express, Playwright), typés et mis en bundle avec le reste.
      - run: npm ci --prefix browser-service --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Unités systemd rendues depuis deploy/systemd/ : chacune reste « OK » pour systemd-analyze (exposition sous 5, seuil 49).
      - name: systemd units exposure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv venv
          echo '{}' > config.json
          mkdir -p rag_app/qdrant && printf '#!/bin/sh\nexit 0\n' > rag_app/qdrant/qdrant && chmod +x rag_app/qdrant/qdrant
          d="$(mktemp -d)"
          APP_SANDBOX_DIR="$PWD/user_sandboxes" RAG_STORE_DIR="$PWD/user_db/rag" RAG_CACHE_DIR="$PWD/user_db/rag-cache" \
            ELPIS_NODE="$(command -v node)" ./elpis service print \
            | awk -v d="$d" '/^### /{f = ($2 ~ /\.service$/) ? d "/" $2 : ""; next} f {print > f}'
          n=0
          for u in "$d"/*.service; do
            systemd-analyze security --offline=true --threshold=49 --no-pager "$u" > "$u.score" || { cat "$u.score"; exit 1; }
            grep -o 'exposure level for .*' "$u.score"
            n=$((n + 1))
          done
          [ "$n" -eq 5 ] || { echo "expected 5 scored units, got $n"; exit 1; }

  # Non bloquant : npm audit remonte des failles hautes déjà connues (katex, via mermaid) ; résultat à lire dans le journal.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: pipx install pip-audit
      - run: pip-audit -r requirements-rag.txt

  # Non bloquant : conformité REUSE (en-têtes SPDX et REUSE.toml).
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
