<!--
  includes/layout/auth_cards.html -- Authentication entry points (extracted from index.html)

  Two mutually-exclusive cards shown when the user is NOT logged in:

    * Login card  (v-if="!user && !mustChangePassword")
        Username + password form, branding-configurable (colours,
        logo, title, subtitle) via loginConfig fetched from
        /api/public-config.
    * Change-password card  (v-else-if="!user && mustChangePassword")
        Shown on first login when the admin has forced a password
        change; once submitted, the user lands on the normal view.

  Both cards use the same "fixed inset-0 + centered small card" layout.
-->
    <!-- AUDIT 2026-08-02 (S7) — z-[9990] (au lieu de 5000) : les modales
         (transfert 6000, confirm 7000, menu contextuel 8000) vivent HORS des
         blocs v-if="user" et étaient peintes AU-DESSUS de la carte de login
         quand la session expirait modale ouverte — l'utilisateur cliquait
         dans une UI morte sans jamais voir le formulaire. Le watcher user
         ferme aussi les modales connues ; ce z-index est la ceinture. -->
    <div v-if="!user && !mustChangePassword" class="fixed inset-0 z-[9990] flex items-center justify-center p-4"
         :style="loginConfig.bg_color ? ('background:' + loginConfig.bg_color) : 'background:#f8fafc'">
        <div class="rounded-2xl shadow-xl ring-1 ring-slate-200 p-8 w-full max-w-sm"
             :style="'background:' + (loginConfig.card_color || '#ffffff')">
            <div class="text-center mb-6">
                <div v-if="loginConfig.icon_type === 'image' && loginConfig.logo_b64"
                     class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4 overflow-hidden shadow-md">
                    <img :src="loginConfig.logo_b64" class="w-full h-full object-cover">
                </div>
                <div v-else class="w-16 h-16 rounded-2xl mx-auto mb-4 overflow-hidden shadow-md">
                    <img src="static/elpis-256.png" alt="Elpis" class="w-full h-full object-cover">
                </div>
                <h1 class="text-2xl font-bold" :style="loginConfig.text_color ? ('color:' + loginConfig.text_color) : 'color:#1e293b'">{{ loginConfig.title || 'Connexion' }}</h1>
                <p v-if="loginConfig.subtitle" class="text-sm mt-1" :style="loginConfig.text_color ? ('color:' + loginConfig.text_color + ';opacity:.65') : 'color:#64748b'">{{ loginConfig.subtitle }}</p>
            </div>
            <form @submit.prevent="login" class="space-y-4">
                <input v-model="loginForm.username" type="text" aria-label="Identifiant" autocomplete="username" placeholder="Identifiant" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
                <input v-model="loginForm.password" type="password" aria-label="Mot de passe" autocomplete="current-password" placeholder="Mot de passe" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
                <div v-if="loginError" class="text-red-500 text-center text-sm font-medium">{{ loginError }}</div>
                <button type="submit" :disabled="isLoading" class="w-full text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2"
                        :style="'background:' + (loginConfig.btn_color || '#0f172a')">
                    <i v-if="isLoading" class="ph ph-spinner animate-spin"></i><span>{{ isLoading ? 'Connexion...' : 'Se connecter' }}</span>
                </button>
            </form>
        </div>
    </div>

    <div v-else-if="!user && mustChangePassword" class="fixed inset-0 z-[9990] flex items-center justify-center bg-slate-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl ring-1 ring-slate-200 p-8 w-full max-w-sm animate-[slideUp_0.2s]">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-orange-500 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-md shadow-orange-500/30"><i class="ph ph-lock-key text-3xl text-white"></i></div>
                <h1 class="text-xl font-bold text-slate-800">Action requise</h1>
                <p class="text-sm text-slate-500 mt-2">Pour des raisons de sécurité, vous devez modifier votre mot de passe temporaire avant de continuer.</p>
            </div>
            <form @submit.prevent="submitForcePasswordChange" class="space-y-4">
                <input v-model="newPasswordForce" type="password" aria-label="Nouveau mot de passe" autocomplete="new-password" placeholder="Nouveau mot de passe" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
                <button type="submit" :disabled="isLoading" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
                    <i v-if="isLoading" class="ph ph-spinner animate-spin"></i><span>Appliquer et continuer</span>
                </button>
            </form>
        </div>
    </div>
