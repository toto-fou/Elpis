<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elpis</title>
    <!-- Icônes aux tailles réelles d'affichage (dérivés réduits de elpis.png). -->
    <link rel="icon" type="image/png" sizes="32x32" href="static/elpis-32.png">
    <link rel="apple-touch-icon" href="static/elpis-256.png">
    <!-- Entrées Vite (frontend/src/entries/, balises écrites par apps/core/src/interface/pages.ts) : le diagnostic de
         démarrage, puis l'application. Mermaid, highlight.js, Chart.js et ECharts sont chargés à la demande. -->
    <!-- @entree diagnostic -->
    <!-- @entree main -->
    <link rel="stylesheet" href="static/vendor/src/regular/style.css">
    <link rel="stylesheet" href="static/css/style.css?v=1784227200">
    <!-- Habillages : inertes tant que body.elpis-skin-<id> n'est pas posée (features/reglages/apparence.ts) ;
         après style.css pour gagner les égalités de spécificité sur les jetons. -->
    <link rel="stylesheet" href="static/css/skins/llamacpp.css?v=1784227200">
    <link rel="stylesheet" href="static/css/skins/emeraude.css?v=1784227200">
    <link rel="stylesheet" href="static/css/skins/parchemin.css?v=1784227200">
    <link rel="stylesheet" href="static/css/skins/pingouins.css?v=1784227200">
    <link rel="stylesheet" href="static/css/skins/elpis.css?v=1784227200">
    <link rel="stylesheet" href="static/css/skins/kiki.css?v=1784227200">
    <!-- Mascottes du bloc d'accueil : feuille générée par assets/mascotte/socle_mascottes.py (ne pas éditer). -->
    <link rel="stylesheet" href="static/assets/mascotte/socle-mascottes.css?v=1784227200">
    <!-- Accueil animé : présente avant le montage, sinon la boîte a une hauteur nulle au démarrage. -->
    <link rel="stylesheet" href="static/assets/mascotte/accueil.css?v=1784227200">
    <!-- Feuille Tailwind précompilée (node tools/generate_tailwind_css.mjs) : en fin de <head>, après Phosphor et
         style.css, sinon « .ph { line-height: 1 } » l'emporterait sur « text-lg ». -->
    <link rel="stylesheet" href="static/css/style.tailwind.css?v=1784227200">
</head>
<!-- Fond et texte : jetons de la règle body de style.css (une classe Tailwind sur <body> gèlerait l'habillage). -->
<body class="h-full antialiased overflow-hidden selection:bg-blue-100 selection:text-blue-900">

<div id="vue-error-overlay">
    <div class="box">
        <h2>L'application n'a pas pu démarrer</h2>
        <p>Vue.js n'a pas réussi à monter l'application. Consultez les détails ci-dessous et ouvrez la console du navigateur (F12) pour plus d'informations.</p>
        <pre id="vue-error-details">Diagnostic en cours...</pre>
    </div>
</div>

<!-- Point de montage : frontend/src/components/racine/App.vue. -->
<div id="app" class="h-full w-full relative flex" v-cloak></div>
</body>
</html>
