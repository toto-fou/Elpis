[project]
name = "elpis"
version = "0.1.1"
description = "Self-hosted LLM assistant: agentic chat, per-user sandbox, code editor, scheduled routines and RAG."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Elpis contributors" }]

# Les dépendances sont installées par ./install.sh depuis les fichiers
# requirements*.txt (cœur, RAG, optionnel AGPL) ; elles ne sont pas
# redéclarées ici pour éviter deux sources de vérité.

[tool.ruff]
target-version = "py311"
line-length = 120
src = [".", "office"]
# migration-kit/vecteurs : générateurs de vecteurs écrits pour le core Python retiré, hors du Python restant.
extend-exclude = ["venv", "node_modules", "user_*", "frontend/vendor", "migration-kit/vecteurs"]

[tool.ruff.lint]
# Phase 1 (2026-09-29) : erreurs réelles (syntaxe, noms indéfinis, imports et
# variables inutilisés), pièges courants (B), appels bloquants dans le code
# asynchrone (ASYNC), imports triés (I). Phase 2 : tâches asyncio sans
# référence, attributs de classe mutables, ``Optional`` implicite, fichiers
# ouverts hors ``with``. ``BLE`` et les règles de style ``SIM`` attendront
# (~1 500 ``except Exception`` souvent voulus ; réécritures sans gain).
select = ["E9", "F", "B", "ASYNC", "I", "RUF006", "RUF012", "RUF013", "SIM115", "BLE"]
ignore = [
    "B008",      # Depends(…) de FastAPI en valeur par défaut
    "B904",      # « raise … from err » : à reprendre à part
    "B905",      # zip(strict=…) : longueurs égales par construction
    "ASYNC109",  # paramètre « timeout » des coroutines : convention du code
    "ASYNC240",  # pathlib (stat, exists…) dans une coroutine : coût négligeable
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# BLE001 : appliquée à office/ et rag_app/ seulement (un except large voulu y porte « # noqa: BLE001 »).
"shared_infra/**" = ["BLE"]
"deploy/**" = ["BLE"]
"desktop-agent/**" = ["BLE"]
"skills/**" = ["BLE"]
"tools/**" = ["BLE"]
# ASYNC : un test asynchrone peut bloquer sa propre boucle.
"tests/**" = ["F401", "F841", "ASYNC", "RUF012", "SIM115", "BLE"]

[tool.mypy]
# Typage (2026-09-29) : un premier périmètre, élargi au fil des lots.
python_version = "3.11"
files = [
    "shared_infra/sandbox/agent",
    "shared_infra/runtime",
]
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
