[project]
name = "elpis"
version = "1.0.0"
description = "Self-hosted LLM assistant: agentic chat, per-user sandbox, code editor, scheduled routines and RAG."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Elpis contributors" }]

# Les dépendances sont installées par ./install.sh depuis les fichiers
# requirements*.txt (cœur, RAG, optionnel AGPL) ; elles ne sont pas
# redéclarées ici pour éviter deux sources de vérité.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["venv", "node_modules", "user_*", "frontend/vendor"]

[tool.ruff.lint]
# Phase 1 (2026-09-29) : erreurs réelles (syntaxe, noms indéfinis, imports et
# variables inutilisés), pièges courants (B), appels bloquants dans le code
# asynchrone (ASYNC), imports triés (I). Phase 2 : tâches asyncio sans
# référence, attributs de classe mutables, ``Optional`` implicite, fichiers
# ouverts hors ``with``. ``BLE`` et les règles de style ``SIM`` attendront
# (~1 500 ``except Exception`` souvent voulus ; réécritures sans gain).
select = ["E9", "F", "B", "ASYNC", "I", "RUF006", "RUF012", "RUF013", "SIM115"]
ignore = [
    "B008",      # Depends(…) de FastAPI en valeur par défaut
    "B904",      # « raise … from err » : à reprendre à part
    "B905",      # zip(strict=…) : longueurs égales par construction
    "ASYNC109",  # paramètre « timeout » des coroutines : convention du code
    "ASYNC240",  # pathlib (stat, exists…) dans une coroutine : coût négligeable
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# ASYNC : un test asynchrone peut bloquer sa propre boucle.
"tests/**" = ["F401", "F841", "ASYNC", "RUF012", "SIM115"]
"**/__init__.py" = ["F401"]
# Ordre d'import = ordre d'enregistrement des routes, ou de chargement des
# sous-modules : jamais trié.
"shared_infra/routes/__init__.py" = ["F401", "I001"]
"shared_infra/routes/admin/__init__.py" = ["F401", "I001"]
"llm_core/__init__.py" = ["F401", "I001"]
"shared_infra/memory/ax/__init__.py" = ["F401", "I001"]
"toolhost/app.py" = ["I001"]
# Signatures d'outils MCP : défauts (``[]``, ``None``) et types sont dans le
# schéma vu par le modèle, et FastMCP (pydantic) passe une copie des défauts à
# chaque appel ; aucun outil ne modifie ses arguments (vérifié le 2026-09-29).
"llm_core/tools/*.py" = ["B006", "RUF013"]
# Crochets optionnels d'un fournisseur de mémoire, vides par défaut.
"llm_core/memory/_provider.py" = ["B027"]
# Fixtures pytest importées d'un autre module de tests, puis reçues en paramètre.
"tests/llm_core/test_agent_tooling_missions_2026_08_08.py" = ["F811"]
"tests/llm_core/test_pw_gwt_dropdowns_2026_08_08.py" = ["F811"]
"tests/llm_core/test_pw_naming_harmonization_2026_08_08.py" = ["F811"]
"tests/llm_core/test_pw_robustesse_2026_09_05.py" = ["F811"]

[tool.mypy]
# Typage (2026-09-29) : un premier périmètre, élargi au fil des lots.
python_version = "3.11"
files = [
    "shared_infra/sandbox/paths.py",
    "shared_infra/sandbox/git_ops.py",
    "shared_infra/sandbox/git_relay.py",
    "shared_infra/sandbox/agent",
    "shared_infra/sandbox/agent_client.py",
    "shared_infra/runtime",
    "llm_core/_tool_traits.py",
    "llm_core/context/tokens.py",
    "llm_core/_scheduling",
    "llm_core/engine",
]
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
