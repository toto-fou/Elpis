[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Le repo contient un package ``code/`` (MCP client/server) qui shadow le
# module stdlib ``code`` à l'import via cwd. ``_pytest.debugging`` fait
# ``import pdb`` au boot, qui fait ``import code`` — qui résout sur le
# faux. Conséquence : pytest plante avec
# ``AttributeError: module 'code' has no attribute 'InteractiveConsole``
# avant même la collecte. On désactive le plugin debugging (qui n'apporte
# que le PDB-on-failure, jamais utilisé en CI/dev courant). Le vrai fix
# attendra la phase 6 du refactor (cleanup du code/ legacy).
# Parallèle par défaut (pytest-xdist, requirements-dev.txt) : 4 cœurs →
# ~1 min 35 au lieu de ~5 min. En série pour déboguer : ``pytest -n0``.
addopts = -p no:debugging -n auto
